# Platform-admin managed. The chart creates the ServiceAccount and namespaced RBAC.
# Substitute namespace and EgressIP resource names.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ufei-team-a
rules:
  - apiGroups: [k8s.ovn.org]
    resources: [egressips]
    resourceNames: [team-a-egress]
    # The application lists with a metadata.name field selector for each allowed name.
    verbs: [list, delete]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [team-a]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ufei-team-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ufei-team-a
subjects:
  - kind: ServiceAccount
    name: ufei
    namespace: team-a
