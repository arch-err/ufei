name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1f # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - name: Validate release
        id: release
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          version=${GITHUB_REF_NAME#v}
          chart_version=$(awk '$1 == "version:" {print $2}' charts/ufei/Chart.yaml)
          app_version=$(awk '$1 == "appVersion:" {print $2}' charts/ufei/Chart.yaml)
          test "$version" = "$chart_version"
          test "$version" = "$app_version"

          repository=${GITHUB_REPOSITORY,,}
          owner=${GITHUB_REPOSITORY_OWNER,,}
          {
            echo "version=$version"
            echo "image=ghcr.io/$repository"
            echo "chart_registry=oci://ghcr.io/$owner/charts"
          } >> "$GITHUB_OUTPUT"
      - name: Package binaries
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            package="ufei_${VERSION}_linux_${arch}"
            mkdir -p "dist/$package"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath -ldflags='-s -w' -o "dist/$package/ufei" ./cmd/ufei
            cp LICENSE README.md "dist/$package/"
            tar -C dist -czf "dist/$package.tar.gz" "$package"
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Package and publish chart
        env:
          CHART_REGISTRY: ${{ steps.release.outputs.chart_registry }}
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cp -R charts/ufei "$RUNNER_TEMP/chart"
          sed -i \
            -e "s|^  repository: ufei$|  repository: $IMAGE|" \
            -e "s|^  digest: \"\"$|  digest: \"$DIGEST\"|" \
            "$RUNNER_TEMP/chart/values.yaml"
          grep -Fx "  repository: $IMAGE" "$RUNNER_TEMP/chart/values.yaml"
          grep -Fx "  digest: \"$DIGEST\"" "$RUNNER_TEMP/chart/values.yaml"
          helm lint --strict "$RUNNER_TEMP/chart" -f examples/values.yaml
          helm package "$RUNNER_TEMP/chart" --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/ufei-$VERSION.tgz" "$CHART_REGISTRY"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          (cd dist && sha256sum ./*.tar.gz ./*.tgz > checksums.txt)
          gh release create "$GITHUB_REF_NAME" \
            dist/ufei_*.tar.gz \
            "dist/ufei-$VERSION.tgz" \
            dist/checksums.txt \
            --generate-notes \
            --title "ufei $VERSION" \
            --verify-tag
